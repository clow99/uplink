services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uplink
    container_name: uplink
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    ports:
      - "8063:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
